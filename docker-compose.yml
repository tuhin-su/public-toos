services:
  postgres:
    image: docker.io/library/postgres:latest
    container_name: postgres_service
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: laravel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  # Redis Cache Service
  redis:
    image: docker.io/library/redis:latest
    container_name: redis_service
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network

  # Node.js Asset Compiler Service (e.g., Vite/Webpack)
  node:
    image: docker.io/library/node:latest
    container_name: node_service
    working_dir: /var/www/html
    volumes:
      - ./app:/var/www/html
    ports:
      - "5173:5173"
    networks:
      - app_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  app_network:
    driver: bridge